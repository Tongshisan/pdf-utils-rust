<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>图片水印去除工具 - WASM 示例</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
					'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				min-height: 100vh;
				padding: 20px;
			}

			.container {
				max-width: 1400px;
				margin: 0 auto;
			}

			h1 {
				color: white;
				text-align: center;
				margin-bottom: 30px;
				font-size: 2.5em;
				text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
			}

			.main-content {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 20px;
				margin-bottom: 20px;
			}

			.preview-section {
				background: white;
				border-radius: 15px;
				padding: 25px;
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
			}

			.preview-section h2 {
				color: #667eea;
				margin-bottom: 15px;
			}

			.image-preview {
				width: 100%;
				border: 2px solid #ddd;
				border-radius: 8px;
				min-height: 400px;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #f5f5f5;
				overflow: hidden;
			}

			.image-preview img {
				max-width: 100%;
				max-height: 500px;
				object-fit: contain;
			}

			.controls-section {
				background: white;
				border-radius: 15px;
				padding: 25px;
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
			}

			.control-group {
				margin-bottom: 20px;
				padding: 20px;
				border: 1px solid #e0e0e0;
				border-radius: 8px;
				background: #f9f9f9;
			}

			.control-group h3 {
				color: #764ba2;
				margin-bottom: 15px;
				font-size: 1.2em;
			}

			.control-group label {
				display: block;
				margin-bottom: 8px;
				color: #333;
				font-weight: 500;
			}

			.control-group input[type='number'],
			.control-group input[type='range'],
			.control-group select {
				width: 100%;
				padding: 10px;
				border: 1px solid #ddd;
				border-radius: 6px;
				margin-bottom: 10px;
			}

			.control-group input[type='range'] {
				padding: 0;
			}

			.control-group .range-value {
				display: inline-block;
				margin-left: 10px;
				font-weight: bold;
				color: #667eea;
			}

			.color-picker-group {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 10px;
			}

			.color-input {
				display: flex;
				align-items: center;
				gap: 10px;
			}

			input[type='color'] {
				width: 60px;
				height: 40px;
				border: 1px solid #ddd;
				border-radius: 4px;
				cursor: pointer;
			}

			.file-input {
				display: block;
				width: 100%;
				padding: 15px;
				margin-bottom: 15px;
				border: 2px dashed #667eea;
				border-radius: 8px;
				cursor: pointer;
				transition: all 0.3s;
				background: white;
			}

			.file-input:hover {
				background: #f5f5f5;
				border-color: #764ba2;
			}

			button {
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				color: white;
				border: none;
				padding: 12px 24px;
				border-radius: 8px;
				cursor: pointer;
				font-size: 16px;
				font-weight: bold;
				width: 100%;
				transition: all 0.3s;
				margin-top: 10px;
			}

			button:hover:not(:disabled) {
				transform: scale(1.02);
				box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
			}

			button:disabled {
				background: #ccc;
				cursor: not-allowed;
			}

			.status {
				margin-top: 20px;
				padding: 15px;
				border-radius: 8px;
				text-align: center;
				font-weight: bold;
			}

			.status.success {
				background: #d4edda;
				color: #155724;
			}

			.status.error {
				background: #f8d7da;
				color: #721c24;
			}

			.status.info {
				background: #d1ecf1;
				color: #0c5460;
			}

			.tabs {
				display: flex;
				gap: 10px;
				margin-bottom: 20px;
			}

			.tab {
				flex: 1;
				padding: 12px;
				background: #e0e0e0;
				border: none;
				border-radius: 8px 8px 0 0;
				cursor: pointer;
				font-weight: bold;
				transition: all 0.3s;
			}

			.tab.active {
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				color: white;
			}

			.tab-content {
				display: none;
			}

			.tab-content.active {
				display: block;
			}

			.instructions {
				background: #fff3cd;
				padding: 15px;
				border-radius: 8px;
				margin-bottom: 20px;
				border-left: 4px solid #ffc107;
			}

			.instructions h4 {
				color: #856404;
				margin-bottom: 10px;
			}

			.instructions ol {
				margin-left: 20px;
				color: #856404;
			}

			.instructions li {
				margin-bottom: 5px;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<h1>🎨 图片水印去除工具</h1>

			<div class="instructions">
				<h4>使用说明：</h4>
				<ol>
					<li>选择一张带有水印的图片</li>
					<li>选择合适的去除方法（区域修复、颜色过滤或淡化）</li>
					<li>根据选择的方法调整相应参数</li>
					<li>点击处理按钮查看效果</li>
					<li>满意后可下载处理后的图片</li>
				</ol>
			</div>

			<div class="controls-section" style="margin-bottom: 20px">
				<input
					type="file"
					id="imageInput"
					accept="image/*"
					class="file-input"
				/>
			</div>

			<div class="main-content">
				<div class="preview-section">
					<h2>原图</h2>
					<div class="image-preview" id="originalPreview">
						<p style="color: #999">请选择一张图片</p>
					</div>
				</div>

				<div class="preview-section">
					<h2>处理后</h2>
					<div class="image-preview" id="processedPreview">
						<p style="color: #999">等待处理</p>
					</div>
					<button id="downloadBtn" disabled style="margin-top: 15px">
						下载处理后的图片
					</button>
				</div>
			</div>

			<div class="controls-section">
				<div class="tabs">
					<button class="tab active" data-tab="region">区域修复</button>
					<button class="tab" data-tab="color">颜色过滤</button>
					<button class="tab" data-tab="fade">淡化水印</button>
				</div>

				<!-- 区域修复方法 -->
				<div class="tab-content active" id="region-content">
					<div class="control-group">
						<h3>📍 区域修复方法</h3>
						<p style="color: #666; margin-bottom: 15px">
							指定水印所在的区域，使用智能算法修复该区域
						</p>

						<label>X 坐标：</label>
						<input type="number" id="regionX" value="100" min="0" />

						<label>Y 坐标：</label>
						<input type="number" id="regionY" value="100" min="0" />

						<label>宽度：</label>
						<input type="number" id="regionWidth" value="200" min="1" />

						<label>高度：</label>
						<input type="number" id="regionHeight" value="100" min="1" />

						<label>修复方法：</label>
						<select id="regionMethod">
							<option value="average">平均值填充（适合纯色背景）</option>
							<option value="blur">模糊处理（适合复杂背景）</option>
							<option value="median">中值滤波（适合去除噪点）</option>
						</select>

						<button id="regionBtn">处理图片</button>
					</div>
				</div>

				<!-- 颜色过滤方法 -->
				<div class="tab-content" id="color-content">
					<div class="control-group">
						<h3>🎨 颜色过滤方法</h3>
						<p style="color: #666; margin-bottom: 15px">
							去除特定颜色范围的水印（适合纯色水印）
						</p>

						<label>目标颜色（选择水印颜色）：</label>
						<div class="color-picker-group">
							<div>
								<label>红色 (R)：</label>
								<input
									type="number"
									id="targetR"
									value="200"
									min="0"
									max="255"
								/>
							</div>
							<div>
								<label>绿色 (G)：</label>
								<input
									type="number"
									id="targetG"
									value="200"
									min="0"
									max="255"
								/>
							</div>
							<div>
								<label>蓝色 (B)：</label>
								<input
									type="number"
									id="targetB"
									value="200"
									min="0"
									max="255"
								/>
							</div>
						</div>

						<label>
							容差范围：<span class="range-value" id="toleranceValue">30</span>
						</label>
						<input type="range" id="tolerance" value="30" min="0" max="100" />

						<label style="margin-top: 15px">
							<input type="checkbox" id="replaceWhite" checked />
							使用白色填充（取消勾选则使用周围像素）
						</label>

						<button id="colorBtn">处理图片</button>
					</div>
				</div>

				<!-- 淡化水印方法 -->
				<div class="tab-content" id="fade-content">
					<div class="control-group">
						<h3>💡 淡化水印方法</h3>
						<p style="color: #666; margin-bottom: 15px">
							通过增加亮度来淡化水印（适合深色水印）
						</p>

						<label>X 坐标：</label>
						<input type="number" id="fadeX" value="100" min="0" />

						<label>Y 坐标：</label>
						<input type="number" id="fadeY" value="100" min="0" />

						<label>宽度：</label>
						<input type="number" id="fadeWidth" value="200" min="1" />

						<label>高度：</label>
						<input type="number" id="fadeHeight" value="100" min="1" />

						<label>
							亮度增加：<span class="range-value" id="brightnessValue">50</span>
						</label>
						<input type="range" id="brightness" value="50" min="0" max="150" />

						<button id="fadeBtn">处理图片</button>
					</div>
				</div>

				<div id="status"></div>
			</div>
		</div>

		<script type="module">
			// 导入 WASM 模块
			import init, * as wasm from '../pkg/web/pdf_utils_rust.js';

			let originalImage = null;
			let processedImage = null;

			// 初始化 WASM
			async function initWasm() {
				try {
					await init();
					showStatus('✅ WASM 模块加载成功，可以开始使用', 'success');
				} catch (error) {
					showStatus('❌ WASM 模块加载失败: ' + error.message, 'error');
				}
			}

			// 显示状态信息
			function showStatus(message, type = 'info') {
				const statusDiv = document.getElementById('status');
				statusDiv.textContent = message;
				statusDiv.className = `status ${type}`;
				setTimeout(() => {
					statusDiv.textContent = '';
					statusDiv.className = 'status';
				}, 5000);
			}

			// 标签页切换
			document.querySelectorAll('.tab').forEach((tab) => {
				tab.addEventListener('click', () => {
					// 移除所有活动状态
					document
						.querySelectorAll('.tab')
						.forEach((t) => t.classList.remove('active'));
					document
						.querySelectorAll('.tab-content')
						.forEach((c) => c.classList.remove('active'));

					// 添加活动状态
					tab.classList.add('active');
					const tabId = tab.dataset.tab;
					document.getElementById(`${tabId}-content`).classList.add('active');
				});
			});

			// 图片选择
			document
				.getElementById('imageInput')
				.addEventListener('change', async (e) => {
					const file = e.target.files[0];
					if (!file) return;

					try {
						const arrayBuffer = await file.arrayBuffer();
						originalImage = new Uint8Array(arrayBuffer);

						// 显示原图
						const blob = new Blob([originalImage], { type: file.type });
						const url = URL.createObjectURL(blob);
						const img = document.createElement('img');
						img.src = url;
						document.getElementById('originalPreview').innerHTML = '';
						document.getElementById('originalPreview').appendChild(img);

						showStatus('✅ 图片加载成功', 'success');
					} catch (error) {
						showStatus('❌ 图片加载失败: ' + error.message, 'error');
					}
				});

			// 区域修复方法
			document.getElementById('regionBtn').addEventListener('click', () => {
				if (!originalImage) {
					showStatus('⚠️ 请先选择一张图片', 'error');
					return;
				}

				const x = parseInt(document.getElementById('regionX').value);
				const y = parseInt(document.getElementById('regionY').value);
				const width = parseInt(document.getElementById('regionWidth').value);
				const height = parseInt(document.getElementById('regionHeight').value);
				const method = document.getElementById('regionMethod').value;

				try {
					showStatus('⏳ 正在处理图片...', 'info');
					processedImage = wasm.remove_watermark_by_region(
						originalImage,
						x,
						y,
						width,
						height,
						method
					);
					displayProcessedImage();
					showStatus('✅ 处理完成', 'success');
				} catch (error) {
					showStatus('❌ 处理失败: ' + error, 'error');
				}
			});

			// 颜色过滤方法
			document.getElementById('colorBtn').addEventListener('click', () => {
				if (!originalImage) {
					showStatus('⚠️ 请先选择一张图片', 'error');
					return;
				}

				const r = parseInt(document.getElementById('targetR').value);
				const g = parseInt(document.getElementById('targetG').value);
				const b = parseInt(document.getElementById('targetB').value);
				const tolerance = parseInt(document.getElementById('tolerance').value);
				const replaceWhite = document.getElementById('replaceWhite').checked;

				try {
					showStatus('⏳ 正在处理图片...', 'info');
					processedImage = wasm.remove_watermark_by_color(
						originalImage,
						r,
						g,
						b,
						tolerance,
						replaceWhite
					);
					displayProcessedImage();
					showStatus('✅ 处理完成', 'success');
				} catch (error) {
					showStatus('❌ 处理失败: ' + error, 'error');
				}
			});

			// 淡化水印方法
			document.getElementById('fadeBtn').addEventListener('click', () => {
				if (!originalImage) {
					showStatus('⚠️ 请先选择一张图片', 'error');
					return;
				}

				const x = parseInt(document.getElementById('fadeX').value);
				const y = parseInt(document.getElementById('fadeY').value);
				const width = parseInt(document.getElementById('fadeWidth').value);
				const height = parseInt(document.getElementById('fadeHeight').value);
				const brightness = parseInt(
					document.getElementById('brightness').value
				);

				try {
					showStatus('⏳ 正在处理图片...', 'info');
					processedImage = wasm.fade_watermark(
						originalImage,
						x,
						y,
						width,
						height,
						brightness
					);
					displayProcessedImage();
					showStatus('✅ 处理完成', 'success');
				} catch (error) {
					showStatus('❌ 处理失败: ' + error, 'error');
				}
			});

			// 显示处理后的图片
			function displayProcessedImage() {
				const blob = new Blob([processedImage], { type: 'image/png' });
				const url = URL.createObjectURL(blob);
				const img = document.createElement('img');
				img.src = url;
				document.getElementById('processedPreview').innerHTML = '';
				document.getElementById('processedPreview').appendChild(img);
				document.getElementById('downloadBtn').disabled = false;
			}

			// 下载处理后的图片
			document.getElementById('downloadBtn').addEventListener('click', () => {
				if (!processedImage) return;

				const blob = new Blob([processedImage], { type: 'image/png' });
				const url = URL.createObjectURL(blob);
				const a = document.createElement('a');
				a.href = url;
				a.download = 'removed-watermark.png';
				a.click();
				URL.revokeObjectURL(url);
				showStatus('✅ 图片已下载', 'success');
			});

			// 实时更新滑块值
			document.getElementById('tolerance').addEventListener('input', (e) => {
				document.getElementById('toleranceValue').textContent = e.target.value;
			});

			document.getElementById('brightness').addEventListener('input', (e) => {
				document.getElementById('brightnessValue').textContent = e.target.value;
			});

			// 初始化
			initWasm();
		</script>
	</body>
</html>
